<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Card Board</title>
        <link rel="stylesheet" href="./styles/board.css" />
        <link rel="stylesheet" href="./styles/selection.css" />
        <link rel="stylesheet" href="./styles/animations.css" />
    </head>

    <body>
        <div class="status">
            <div class="player-status">Player - HP: 100</div>
            <div class="turn">Turn 1</div>
            <div class="enemy-status">HP: 100 - Enemy</div>
        </div>

        <div class="card-board"> 

            <div class="flat-perspective hand2">
                <div class="hoverable card"></div>
                <div class="hoverable card"></div>
                <div class="hoverable card"></div>
            </div>

            <div class="flat-perspective hand1">
                <!--
                <div class="hoverable card"></div>
                <div class="hoverable card"></div>
                <div class="hoverable card"></div>
                -->
                
            </div>

            <div class="third-perspective"> 
                <div class="board-in-perspective">
                    <div class="place status2"></div>

                    <div class="place fields deck2">
                        <div class="card-place">Deck2</div>
                    </div>

                    <div class="place fields grave2">
                        <div class="hoverable card-place">Graveyard2</div>
                    </div>

                    <div class="place fields field2">
                        <div class="hoverable card-place">Field2</div>
                        <div class="hoverable card-place">Field2</div>
                        <div class="hoverable card-place">Field2</div>
                    </div>

                    <div class="place phases">
                        <div class="turn-indicator1">Player 1</div>
                        <div class="phase-indicator">
                            <div class="phase draw-phase">Draw Phase</div>
                            <div class="phase main-phase">Main Phase</div>
                            <div class="phase battle-phase">Battle Phase</div>
                            <div class="phase end-phase">End Phase</div>
                        </div>
                        <div class="turn-indicator2">Player 2</div>
                    </div>

                    <div class="place fields field1">
                        <div class="hoverable card-place">Field1</div>
                        <div class="hoverable card-place">Field1</div>
                        <div class="hoverable card-place">Field1</div>
                    </div>

                    <div class="place fields grave1">
                        <div class="hoverable card-place">Graveyard1</div>
                    </div>
                    
                    <div class="place fields deck1" style="pointer-events: none;">
                        <div class="card-place" style="pointer-events: none;">
                            <div class="hoverable card deck-stack">
                                <div class="card-back" style="pointer-events: none;"></div>

                                <div class="card deck-stack flying">
                                    <div class="card-back"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="place status1"></div>
                </div>
            </div>
        </div>
        

    <script type="module" src="./scripts/main.js"></script>
    </body>
</html>
