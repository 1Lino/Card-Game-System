<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Summon Animation Mockup</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1e1e1e;
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .board {
        position: relative;
        width: 600px;
        height: 500px;
        border: 1px dashed #555;
      }

      .hand, .field {
        position: absolute;
        width: 500px;
        height: 140px;
        border: 2px solid #aaa;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;

        left: 8%;
        background: #222;
      }

      .hand {
        bottom: 1%;
      }

      .field{
        top: 1%;
      }

      .card {
        width: 80px;
        height: 120px;
        background: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        color: black;
        position: relative;

        &:hover{
          cursor: pointer;
          transform: scale(1.1);
        }
      }

      .button {
        margin-top: 20px;
        padding: 8px 14px;
        cursor: pointer;
      }

      .selected {
        outline: 3px dashed red;
      }

      .flying-card { 
        position: absolute;
        z-index: 10;
        opacity: 0.5;
        transform: translate(0, 0);
        transition:
          transform 0.6s cubic-bezier(.3,.8,.3,1),
          opacity 0.5s ease;
      }
          
      .move {
        transform: translate(0, -300px);
        opacity: 1;
      }

      .slot{
        width: 80px;
        height: 120px;
        border-radius: 6px;
        margin: 20px;
        outline: 3px solid white;
      }

    </style>
  </head>
  <body>

    <div class="board">
      <div class="field">
        <div class="slot" data-component="slot" data-index="slot1" data-state="empty"></div>
        <div class="slot" data-component="slot" data-index="slot2" data-state="empty"></div>
        <div class="slot" data-component="slot" data-index="slot3" data-state="empty"></div>
      </div>
      <div class="hand">
        <div class="card" data-index="card1" data-component="card" data-state="in-hand" data-owner="player">Card1</div>
        <div class="card" data-index="card2" data-component="card" data-state="in-hand" data-owner="player">Card2</div>
        <div class="card" data-index="card3" data-component="card" data-state="in-hand" data-owner="player">Card3</div>
      </div>
      
    </div>
    <button class="button">Usar card</button>
    <script>

      // GAME_STATE
      const GAME_STATE = {
        player: {
          deck: [],
          hand: ['card1', 'card2', 'card3'],
          field: []
        },
        selectedCardIndex: null,
        selectedCardState: null,
        selectedCardOwner: null
      }

      // GAME_ENGINE
      class GameEngine
      {
        constructor(state){
          this.state = state;
        }
        
        drawCard(){
          const card = this.state.player.deck[this.state.player.deck.length - 1];
          this.state.player.hand.push(card);
          this.state.player.deck.pop();
          return card;
        }

        selectCard(cardDetails){
          this.state.selectedCardIndex = cardDetails.index;
          this.state.selectedCardState = cardDetails.state;
          this.state.selectedCardOwner = cardDetails.owner;
        }

        getSelectedCardId(){
          return this.state.selectedCardIndex;
        }

      }

      // INTERFACE
      class GameInterface
      {
        // atributos declarados com # ficam privados.
        #hand; 
        #field;
        #board;
        //#button;
        //#fieldSlots; // tenho que ver como que retorna o valor de um atributo privado. Testarei clonar isso pra ver.

        constructor(){
          this.#hand = document.querySelector('.hand');
          this.#field = document.querySelector('.field');
          this.#board = document.querySelector('.board');
          this.button = document.querySelector('.button');
          this.fieldSlots = document.querySelectorAll('[data-component="slot"]');
        }

        targetSlot(target){
          switch (target){

            case "hand":
              // TODO...
              return null;

            case "field":
              return this.fieldSlots;

            case "grave":
              // TODO...
              return null;

            default:
              break;
          }
        }

        toggleSelectionEffect(card){
          document.querySelectorAll('.card').forEach(card => card.classList.remove('selected'));
          card.classList.toggle('selected');
        }

        /**
         * @param {Node|NodeList} slotOrSlots
         * @returns {Node|null}
         */
        getEmptySlot(slotOrSlots){
          const slots = (slotOrSlots instanceof NodeList) ? slotOrSlots : [slotOrSlots];
  
          for (const slot of slots){
            if (slot.dataset.state === 'empty'){
              return slot;
            }
          }
          return null;
        }

        /**
         * @param {String} cardIndex
         * @param {Node|NodeList} targetSlot
         */
        async renderCardTo(cardIndex, targetSlot){
          // WARN: essa validação deve ser feita pela engine, não por uma função de UI.
          // também o try... catch deve ser feito pela GameInterface, não pelo evento.
          if (cardIndex === null) throw new Error ('Um card precisa ser selecionado para que a função funcione!');

          const card = document.querySelector(`[data-index="${cardIndex}"]`);

          const slot = this.getEmptySlot(targetSlot);

          // WARN: se o card está "in-hand" logo a renderização pode ocorrer. Essa validação também pode ser feita pela engine, de modo que essa função só se preocupe exclusivamente com a renderização
          if (card.dataset.state === 'in-hand'){

            console.group(`Summon of ${card.dataset.index}`);

            card.style.visibility = "hidden";

            console.log(`Starting summon animation!`);

            await this.flyCardAnimation(card, slot);

            slot.insertAdjacentElement('beforeend', card);
            slot.dataset.state = 'occupied';

            card.style.visibility = "visible";
            card.dataset.state = 'in-field';

            console.log(`${card.dataset.index} added to field!`);
            console.groupEnd();
          }
        };

        async flyCardAnimation(card, selectedSlot){
          return new Promise(resolve => {

              const flyingCard = card.cloneNode(true);

              flyingCard.classList.add('card', 'flying-card');
              // flyingCard deve ser inserido ao DOM para que getBoundingClientRect funcione.
              card.insertAdjacentElement('beforeend', flyingCard); 

              const flyingCardPos = flyingCard.getBoundingClientRect();
              const selectedSlotPos = selectedSlot.getBoundingClientRect();
              const deltaX = selectedSlotPos.left - flyingCardPos.left;
              const deltaY = selectedSlotPos.top - flyingCardPos.top;

              // isto é importante para que flyingCard não fique invisível junto ao parente card.
              flyingCard.style.visibility = "visible"; 
            
              console.log('Summon animation starts!');
              console.log(`Card leaves hand at X: ${flyingCardPos.left}\nCard goes to empty slot at X: ${selectedSlotPos.left}`);

              // TIP: pesquisar sobre como esta "resquestAnimationFrame" funciona, e como seria isto em outras linguagens como python ou C#, para fins de referência.
              requestAnimationFrame(() => {
                flyingCard.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                flyingCard.style.opacity = 1;

                flyingCard.addEventListener('transitionend', () => {
                  flyingCard.remove();
                  console.log('Summon animation ends!');
                  resolve();
                }, { once: true });
              });
            }
          );
        }
      }

      const gameEngine = new GameEngine(GAME_STATE);
      const gameInterface = new GameInterface();

      // EVENTOS (devem converter os metadados dos elementos em dados puros para que sejam então passados para a engine. Os
      // metadados dos elementos não devem ser passados diretamente para a engine, mas somente por meio dessa conversão):
      document.querySelectorAll('[data-component="card"]').forEach(card => {
        card.onclick = () => {
          const cardDetails = {
            index: card.dataset.index,
            state: card.dataset.state,
            owner: card.dataset.owner
          }
          gameEngine.selectCard(cardDetails);
          gameInterface.toggleSelectionEffect(card);
          console.log('Selected card: ', gameEngine.getSelectedCardId());
        };
      });

      // TODO: aqui os eventos são geridos pela gameInterface, mas isto não é o ideal. Deve ser criada uma classe chamada
      // GameEvent, que gere todos os eventos de maneira universal (usando event handlers e delegação).
      // um método chamado eventBus deve ser criado nesta classe para poder receber o tipo de evento e o objeto do evento.
      gameInterface.button.onclick = () => {
        try {
          gameInterface.renderCardTo(gameEngine.getSelectedCardId(), gameInterface.targetSlot("field"));
        } catch (err) {
          console.err(err.message);
        }
      };


      /*TODO:
        - flyingCard deve ser criada nas coordenadas do card atual, então summonAnimation vai precisar disso. (x)
        - Pra puxar estas coordenadas, vou utilizar o método getBoundingClientRect no card. (x)
        - Daí, a animação do card sendo lançado no campo deverá começar a partir destas coordenadas. (x)
        - É interessante que seja possível que a animação vá até as coordenadas de um slot de campo, caso exista.
          Isto pode ser facilmente alcançado apenas por alterar a coordenada x do translate da classe move, mas antes
          é preciso capturar a posição x do slot do campo. (x)
        - Esta summonAnimation, do jeito que está, pode ser adaptada para se tornar um tipo de controller, de modo que todas as animações do tipo flyCard podem usar ela. No caso, basta mudar o nome da função e torná-la exportável, pois não há muito o que se adaptar por hora. (x)
        - Já que este código está bem organizado e simples, seria interessante usá-lo como protótipo para criar um sistema de Estado - Engine - Evento - UI. Então aplicar uma separação total de responsabilidades. ()
      */

      /* DESIGN:
      - UI: contém data-* para identificar elementos e ações.

      - Eventos/Listeners: leem data-* e convertem em dados semânticos (objetos JS simples).

      - Engine: recebe apenas esses objetos, interpreta e valida regras, ignorando a origem.

      - Renderização: atualiza a UI com base na resposta da engine.
      */
    </script>
  </body>
</html>
