<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Summon Animation Mockup</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1e1e1e;
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .board {
        position: relative;
        width: 600px;
        height: 500px;
        border: 1px dashed #555;
      }

      .hand, .field {
        position: absolute;
        width: 500px;
        height: 140px;
        border: 2px solid #aaa;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;

        left: 8%;
        background: #222;
      }

      .hand {
        bottom: 1%;
      }

      .field{
        top: 1%;
      }

      .card {
        width: 80px;
        height: 120px;
        background: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        color: black;
        position: relative;

        &:hover{
          cursor: pointer;
          transform: scale(1.1);
        }
      }

      .button {
        margin-top: 20px;
        padding: 8px 14px;
        cursor: pointer;
      }

      .selected {
        outline: 3px dashed red;
      }

      .flying-card { 
        position: absolute;
        z-index: 10;
        opacity: 0.5;
        transform: translate(0, 0);
        transition:
          transform 0.6s cubic-bezier(.3,.8,.3,1),
          opacity 0.5s ease;
      }
          
      .move {
        transform: translate(0, -300px);
        opacity: 1;
      }

      .slot{
        width: 80px;
        height: 120px;
        border-radius: 6px;
        margin: 20px;
        outline: 3px solid white;
      }

    </style>
  </head>
  <body>

    <div class="board">
      <div class="field">
        <div class="slot" data-component="slot" data-index="slot1" data-state="empty"></div>
        <div class="slot" data-component="slot" data-index="slot2" data-state="empty"></div>
        <div class="slot" data-component="slot" data-index="slot3" data-state="empty"></div>
      </div>
      <div class="hand">
        <div class="card" data-component="card" data-index="card1"  data-state="in-hand" data-owner="player">Card1</div>
        <div class="card" data-component="card" data-index="card2"  data-state="in-hand" data-owner="player">Card2</div>
        <div class="card" data-component="card" data-index="card3"  data-state="in-hand" data-owner="player">Card3</div>
      </div>
      
    </div>
    <button class="button">Usar card</button>
    <script>

      // GAME_STATE
      const GAME_STATE = {
        player: {
          deck: [],
          hand: ['card1', 'card2', 'card3'],
          field: []
        },
        selectedCardIndex: null,
        selectedCardState: null,
        selectedCardOwner: null
      }

      // GAME_ENGINE
      class GameEngine
      {
        constructor(state){
          this.state = state;
          console.log(this.state.player);
        }

        /**
         * @param {string} action
         * @param {object} cardDetails
         */
        dispatchAction(action, cardDetails){
          switch (action){
              case "SELECT":
                this.#selectCard(cardDetails);
                break;
              case "DRAW":
                this.#drawCard();
                break;
              case "SUMMON":
                this.#summonCard();
                break;
              case "ATTACK":
                this.#attackCard();
                break;
              default:
                throw new Error (`Error: invalid "${action}"!\nValid argument: SELECT, DRAW, SUMMON, ATTACK.`);
            }
        }
        
        #drawCard(){
          const card = this.state.player.deck[this.state.player.deck.length - 1];
          this.state.player.hand.push(card);
          this.state.player.deck.pop();
          return card;
        }

        #summonCard(){
          if (this.state.selectedCardState !== "in-hand") 
            throw new Error (`Error: card data-state "${this.state.selectedCardState}"\nrequired dada-state "in-hand"`);

          this.state.player.field.push(this.state.selectedCardIndex);
          this.state.player.hand = this.state.player.hand.filter(cardIndex => cardIndex !== this.state.selectedCardIndex);
          
          console.log(`Summoned ${this.state.selectedCardIndex} to field!`); 
          console.log(this.state.player);
        }

        #attackCard(){
          //TODO...
        }

        #selectCard(cardDetails){
          this.state.selectedCardIndex = cardDetails.index;
          this.state.selectedCardState = cardDetails.state;
          this.state.selectedCardOwner = cardDetails.owner;
        }

        getSelectedCardId(){
          try {
            if (this.state.selectedCardIndex === null || this.state.selectedCardIndex === undefined)
              throw new Error('Erro: nenhum card selecionado!');
            return this.state.selectedCardIndex;  
          } catch (err) {
            console.error(err.message);
            return false;
          }
        }

      }

      // INTERFACE
      class GameInterface
      {
        // atributos declarados com # ficam privados.
        #hand; 
        #field;
        #board;
        //#button; // botão tem a ver com evento, portanto irá para a classe GameEvent.
        #fieldSlots; 

        constructor(){
          this.#hand = document.querySelector('.hand');
          this.#field = document.querySelector('.field');
          this.#board = document.querySelector('.board');
          this.button = document.querySelector('.button');
          this.#fieldSlots = document.querySelectorAll('[data-component="slot"]');
        }

        targetSlot(target){
          switch (target){

            case "hand":
              // TODO...
              return null;

            case "field":
              return this.#fieldSlots;

            case "grave":
              // TODO...
              return null;

            default:
              break;
          }
        }

        toggleSelectionEffect(card){
          document.querySelectorAll('.card').forEach(card => card.classList.remove('selected'));
          card.classList.toggle('selected');
        }

        /**
         * @param {Node|NodeList} slotOrSlots
         * @returns {Node|null}
         */
        getEmptySlot(slotOrSlots){
          const slots = (slotOrSlots instanceof NodeList) ? slotOrSlots : [slotOrSlots];
  
          for (const slot of slots){
            if (slot.dataset.state === 'empty'){
              return slot;
            }
          }
          return null;
        }

        /**
         * @param {String} cardIndex
         * @param {Node|NodeList} targetSlot
         */
        async renderCardTo(cardIndex, targetSlot){
          if (!cardIndex) return;

          const card = document.querySelector(`[data-index="${cardIndex}"]`);

          const slot = this.getEmptySlot(targetSlot);

          console.group(`Rendering of ${card.dataset.index}`);

          card.style.visibility = "hidden";

          console.log(`Starting summon animation!`);

          await this.flyCardAnimation(card, slot);

          slot.insertAdjacentElement('beforeend', card);
          slot.dataset.state = 'occupied';

          card.style.visibility = "visible";
          card.dataset.state = 'in-field';

          console.log(`${card.dataset.index} rendered to field!`);
          console.groupEnd();
        };

        async flyCardAnimation(card, selectedSlot){
          return new Promise(resolve => {

              const flyingCard = card.cloneNode(true);

              flyingCard.classList.add('card', 'flying-card');
              // flyingCard deve ser inserido ao DOM para que getBoundingClientRect funcione.
              card.insertAdjacentElement('beforeend', flyingCard); 

              const flyingCardPos = flyingCard.getBoundingClientRect();
              const selectedSlotPos = selectedSlot.getBoundingClientRect();
              const deltaX = selectedSlotPos.left - flyingCardPos.left;
              const deltaY = selectedSlotPos.top - flyingCardPos.top;

              // isto é importante para que flyingCard não fique invisível junto ao parente "card".
              flyingCard.style.visibility = "visible"; 
            
              console.log('Summon animation starts!');
              console.log(`Card leaves hand at X: ${flyingCardPos.left}\nCard goes to empty slot at X: ${selectedSlotPos.left}`);

              requestAnimationFrame(() => {
                flyingCard.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                flyingCard.style.opacity = 1;

                flyingCard.addEventListener('transitionend', () => {
                  flyingCard.remove();
                  console.log('Summon animation ends!');
                  resolve();
                }, { once: true });
              });
            }
          );
        }
      }

      class GameEvent
      {
        constructor(){
          // TODO...
        }

        static eventListener(){
          ["click", "mouseout", "mouseover"].forEach(event => {
            document.body.addEventListener(event, gameComponent => {
              this.eventBus(event, gameComponent.srcElement.dataset.component);
            });
          });
          
        }

        static eventBus(event, component){

          const events = {
            click: () => this.onClick(event, component),
            mouseover: () => this.onMouseOver(event, component),
            mouseout: () => this.onMouseOut(event, component)
          };

          if (['slot', 'card'].includes(component)){
            events[event]();
          }

          if (!(event in events)) 
            throw new Error (`Error: "${event}" is not a valid event!!\nValid events: ${Object.keys(events)}`);
          
        }

        static onClick(event, component){
          console.log(`"${event}" recognized by the event listener! Target component: "${component}".`);
        }

        static onMouseOver(event, component){
          console.log(`"${event}" recognized by the event listener! Target component: "${component}".`);
        }

        static onMouseOut(event, component){
          console.log(`"${event}" recognized by the event listener! Target component: "${component}".`);
        }

      }


      const gameEngine = new GameEngine(GAME_STATE);
      const gameInterface = new GameInterface(); // avaliar uso de classe diretamente.

      // EVENTOS
      document.querySelectorAll('[data-component="card"]').forEach(card => {
        card.onclick = () => {
          const cardDetails = {
            index: card.dataset.index,
            state: card.dataset.state,
            owner: card.dataset.owner
          }
          gameEngine.dispatchAction('SELECT', cardDetails);
          gameInterface.toggleSelectionEffect(card);
          console.log('Selected card: ', gameEngine.getSelectedCardId());
        };
      });

      GameEvent.eventListener();

      // TODO: aqui os eventos são geridos pela gameInterface, mas isto não é o ideal. Deve ser criada uma classe chamada
      // GameEvent, que gere todos os eventos de maneira universal (usando event handlers e delegação).
      // um método chamado eventBus deve ser criado nesta classe para poder receber o tipo de evento e o objeto do evento. 
      gameInterface.button.onclick = () => {
        try {
          gameEngine.dispatchAction('SUMMON');
          gameInterface.renderCardTo(gameEngine.getSelectedCardId(), gameInterface.targetSlot("field"));
        } catch (err) {
          console.error(err.message);
        }
      };

      /*TODO:
        - Já que este código está bem organizado e simples, seria interessante usá-lo como protótipo para criar um sistema de Estado - Engine - Evento - UI. Então aplicar uma separação total de responsabilidades. ()
      */

      /* DESIGN:
      - UI: contém data-* para identificar elementos e ações.

      - Eventos/Listeners: leem data-* e convertem em dados semânticos (objetos JS simples).

      - Engine: recebe apenas esses objetos, interpreta e valida regras, ignorando a origem.

      - Renderização: atualiza a UI com base na resposta da engine.
      */
    </script>
  </body>
</html>
