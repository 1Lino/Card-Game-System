<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Summon Animation Mockup</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1e1e1e;
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .board {
        position: relative;
        width: 600px;
        height: 500px;
        border: 1px dashed #555;
      }

      .hand, .field {
        position: absolute;
        width: 500px;
        height: 140px;
        border: 2px solid #aaa;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;

        left: 8%;
        background: #222;
      }

      .hand {
        bottom: 1%;
      }

      .field{
        top: 1%;
      }

      .card {
        width: 80px;
        height: 120px;
        background: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        color: black;
        position: relative;

        &:hover{
          cursor: pointer;
          transform: scale(1.1);
        }
      }

      .button {
        margin-top: 20px;
        padding: 8px 14px;
        cursor: pointer;
      }

      .selected {
        outline: 3px dashed red;
      }

      .flying-card { 
        position: absolute;
        z-index: 10;
        opacity: 0.5;
        transform: translate(0, 0);
        transition:
          transform 0.6s cubic-bezier(.3,.8,.3,1),
          opacity 0.5s ease;
      }
          
      .move {
        transform: translate(0, -300px);
        opacity: 1;
      }

      .slot{
        width: 80px;
        height: 120px;
        border-radius: 6px;
        margin: 20px;
        outline: 3px solid white;
      }

    </style>
  </head>
  <body>

    <div class="board">
      <div class="field">
        <div class="slot" data-component="slot" data-index="slot1" data-state="empty"></div>
        <div class="slot" data-component="slot" data-index="slot2" data-state="empty"></div>
        <div class="slot" data-component="slot" data-index="slot3" data-state="empty"></div>
      </div>
      <div class="hand">
        <div class="card" data-index="card1" data-component="card" data-state="in-hand">Card1</div>
        <div class="card" data-index="card2" data-component="card" data-state="in-hand">Card2</div>
        <div class="card" data-index="card3" data-component="card" data-state="in-hand">Card3</div>
      </div>
      
    </div>
    <button class="button">Usar card</button>
    <script>
      const hand = document.querySelector('.hand');
      const field = document.querySelector('.field');
      const board = document.querySelector('.board');
      const button = document.querySelector('.button');
      const fieldSlots = document.querySelectorAll('[data-component="slot"]');
      let selectedCard = null;

      // EVENTOS (neste ponto só lidamos com estado, nada de UI, pois eventos são como que uma ponte entre a interação com a interface gráfica e o estado):
      document.querySelectorAll('[data-component="card"]').forEach(card => {
        card.onclick = () => {
          selectedCard = selectCard(card);
          console.log('Selected card: ', selectedCard);
        };
      });

      // Neste ponto, o clique no botão de usar card chama a função que atualiza a interface. No entanto, a atualização de interface deve ser idealmente separada dos eventos. 
      button.onclick = () => {
        try {
          summonCard(selectedCard);
        } catch (err) {
          console.err(err.message);
        }
      };

      // FUNÇÕES:
      function selectCard(card){
        document.querySelectorAll('.card').forEach(card => card.classList.remove('selected'));
        card.classList.toggle('selected');
        return card.dataset.index;
      }

      function getEmptyFieldSlot(field){
        for (slot of field){
          if (slot.dataset.state === 'empty'){
            return slot;
          }
        }
      }

      async function summonCard(cardIndex){
        if (cardIndex === null) throw new Error ('Um card precisa ser selecionado para que a função funcione!');

        const card = document.querySelector(`[data-index="${cardIndex}"]`);

        const slot = getEmptyFieldSlot(fieldSlots);

        if (card.dataset.state === 'in-hand'){

          console.group(`Summon of ${card.dataset.index}`);

          card.style.visibility = "hidden";

          console.log(`Starting summon animation!`);

          await flyCardAnimation(card, slot);

          slot.insertAdjacentElement('beforeend', card);
          slot.dataset.state = 'occupied';

          card.style.visibility = "visible";
          card.dataset.state = 'in-field';

          console.log(`${card.dataset.index} added to field!`);
          console.groupEnd();
        }
      };

      async function flyCardAnimation(card, selectedSlot){
        return new Promise(resolve => {

            const flyingCard = card.cloneNode(true);

            flyingCard.classList.add('card', 'flying-card');
            card.insertAdjacentElement('beforeend', flyingCard); // flyingCard deve ser inserido ao DOM para que getBoundingClientRect funcione.

            const flyingCardPos = flyingCard.getBoundingClientRect();
            const selectedSlotPos = selectedSlot.getBoundingClientRect();
            const deltaX = selectedSlotPos.left - flyingCardPos.left;
            const deltaY = selectedSlotPos.top - flyingCardPos.top;

            // isto é importante para que flyingCard não fique invisível junto ao parente card.
            flyingCard.style.visibility = "visible"; 
          
            console.log('Summon animation starts!');
            console.log(`Card leaves hand at X: ${flyingCardPos.left}\nCard goes to empty slot at X: ${selectedSlotPos.left}`);

            // TIP: pesquisar sobre como esta "resquesAnimationFrame" funciona, e como seria isto em outras linguagens como python ou C#, para fins de referência.
            requestAnimationFrame(() => {
              flyingCard.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
              flyingCard.style.opacity = 1;

              flyingCard.addEventListener('transitionend', () => {
                flyingCard.remove();
                console.log('Summon animation ends!');
                resolve();
              }, { once: true });
            });
          }
        );
      }
      
      /*TODO:
        - flyingCard deve ser criada nas coordenadas do card atual, então summonAnimation vai precisar disso. (x)
        - Pra puxar estas coordenadas, vou utilizar o método getBoundingClientRect no card. (x)
        - Daí, a animação do card sendo lançado no campo deverá começar a partir destas coordenadas. (x)
        - É interessante que seja possível que a animação vá até as coordenadas de um slot de campo, caso exista.
          Isto pode ser facilmente alcançado apenas por alterar a coordenada x do translate da classe move, mas antes
          é preciso capturar a posição x do slot do campo. (x)
        - Esta summonAnimation, do jeito que está, pode ser adaptada para se tornar um tipo de controller, de modo que todas as animações do tipo flyCard podem usar ela. No caso, basta mudar o nome da função e torná-la exportável, pois não há muito o que se adaptar por hora. (x)
        - Já que este código está bem organizado e simples, seria interessante usá-lo como protótipo para criar um sistema de Estado - Engine - Evento - UI. Então aplicar uma separação total de responsabilidades.
      */
    </script>
  </body>
</html>
