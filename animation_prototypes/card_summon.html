<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Summon Animation Mockup</title>
    <style>
      body {
        font-family: sans-serif;
        background: #1e1e1e;
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .board {
        position: relative;
        width: 600px;
        height: 500px;
        border: 1px dashed #555;
      }

      .hand, .field {
        position: absolute;
        width: 500px;
        height: 140px;
        border: 2px solid #aaa;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hand {
        left: 1%;
        bottom: 1%;
        background: #222;
      }

      .field{
        left: 1%;
        top: 1%;
        background: #222;
      }

      .card {
        width: 80px;
        height: 120px;
        background: white;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);

        &:hover{
          cursor: pointer;
          transform: scale(1.1);
        }
      }

      .button {
        margin-top: 20px;
        padding: 8px 14px;
        cursor: pointer;
      }

      .selected {
        outline: 3px dashed red;
      }

    </style>
  </head>
  <body>

    <div class="board">
      <div class="field"></div>
      <div class="hand">
        <div class="card" data-index="card1" data-component="card" data-state="in-hand"></div>
        <div class="card" data-index="card2" data-component="card" data-state="in-hand"></div>
        <div class="card" data-index="card3" data-component="card" data-state="in-hand"></div>
      </div>
      
    </div>
    <button class="button">Usar card</button>
    <script>
      const hand = document.querySelector('.hand');
      const field = document.querySelector('.field');
      const board = document.querySelector('.board');
      const button = document.querySelector('.button');
      let selectedCard = null;

      document.querySelectorAll('[data-component="card"]').forEach(card => {
        card.onclick = () => {
          selectedCard = selectCard(card);
          console.log('Selected card: ', selectedCard);
        };
      });

      button.onclick = () => {
        try {
          summonCard(selectedCard);
        } catch (err) {
          console.err(err.message);
        }
      };

      function selectCard(card){
        document.querySelectorAll('.card').forEach(card => card.classList.remove('selected'));
        card.classList.toggle('selected');
        return card.dataset.index;
      }

      async function summonCard(cardIndex){
        if (cardIndex === null) throw new Error ('Um card precisa ser selecionado antes de ser usado!');

        const card = document.querySelector(`[data-index="${cardIndex}"]`);

        if (card.dataset.state === 'in-hand'){

          const cardCoords = {
            top: card.getBoundingClientRect().top,
            left: card.getBoundingClientRect().left
          };

          card.dataset.state = 'in-field';

          console.group(`Summon of ${card.dataset.index}`);
          hand.querySelector(`[data-index=${card.dataset.index}]`).remove();
          console.log(`${card.dataset.index} removed from hand!`);

          await summonAnimation(cardCoords);

          field.insertAdjacentElement('beforeend', card);
          console.log(`${card.dataset.index} added to field!`);
          console.groupEnd();
        }
      };

      async function summonAnimation(coords){
        return new Promise(resolve => {

            const style = document.querySelector('style');
            const { top, left } = coords;
            const startingCoords = ` 
              .starting-coords{ 
                position: relative;
                bottom: ${(top/100) * 2}px;
                z-index: 10;
                opacity: 0.5;
                transform: translate(0, 0);
                transition:
                  transform 0.6s cubic-bezier(.3,.8,.3,1),
                  opacity 0.5s ease;
              }
                  
              .move {
                transform: translate(${(top/100) * 2}px, -300px);
                opacity: 1;
              }`;

            const moveCoords = `
              
            `;
            style.innerHTML += startingCoords;

            const flyingCard = document.createElement('div');
            flyingCard.classList.add('card', 'starting-coords');
            hand.insertAdjacentElement('beforeend', flyingCard);
          
            console.log('Summon animation starts!');

            requestAnimationFrame(() => {
              flyingCard.classList.add('move');

              flyingCard.addEventListener('transitionend', () => {
                console.log('Summon animation ends!');
                flyingCard.remove();
                resolve();
              }, { once: true });
            });
          }
        );
      }
      
      /*TODO:
        - flyingCard deve ser criada nas coordenadas do card atual, então summonAnimation vai precisar disso. (x)
        - pra puxar estas coordenadas, vou utilizar o método getBoundingClientRect no card. (x)
        - daí a animação do card sendo lançado no campo deverá começar a partir destas coordenadas. ()
      */
    </script>
  </body>
</html>
