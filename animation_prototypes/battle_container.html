<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #1a1a1a;
                color: white;
                font-family: Arial, sans-serif;
            }
            .battle-container {
                position: relative;
                width: 50vw;
                height: 50vh;
                margin: 25vh auto;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.5);
                background-color: gray;
                opacity: 1;
            }
            .battle-container.enter{
                animation: fadeIn 0.5s ease-in forwards;
            }
            .battle-container.exit{
                animation: fadeOut 0.5s ease-out forwards;
            }
            .card {
                position: absolute;
                width: 120px;
                height: 180px;
                background-color: #333;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            }
            @keyframes fadeIn{
                to {
                    opacity: 1;
                }
            }
            @keyframes fadeOut{
                to {
                    opacity: 0;
                }
            }

        </style>
    </head>
    <body>
        <div class="battle-container enter">
            <div class="card" style="top: 20%; left: 10%;"></div>
            <div class="card" style="top: 20%; left: 30%;"></div>
            <div class="card" style="top: 20%; left: 50%;"></div>
            <div class="card" style="top: 20%; left: 70%;"></div>
        </div>
        <button id="enter-battle">Enter Battle</button>
        <button id="exit-battle">Exit Battle</button>
        <script>
            const enterBtn = document.getElementById('enter-battle');
            const exitBtn = document.getElementById('exit-battle');
            const battleContainer = document.querySelector('.battle-container'); 

            enterBtn.onclick = () => toggleContainer('exit', '0', 'enter');
            exitBtn.onclick = () => toggleContainer('enter', '1', 'exit');

            const toggleContainer = (removeClass, opacity, addClass) => {
                battleContainer.classList.remove(removeClass);
                battleContainer.style.opacity = opacity;
                battleContainer.classList.add(addClass);
            };
        </script>
    </body>
</html>
